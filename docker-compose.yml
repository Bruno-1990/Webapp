# Stack única do monorepo (webapp-01 + workers que embutem 02..06).
# Da raiz webapp:  docker compose up -d --build
# Profiles disponiveis: sped, comparacao, nfse
#
# Variaveis de ambiente: lidas de ./.env (env_file). Variaveis tecnicas
# fixas (REDIS_URL interno, TEMP_JOBS_ROOT no volume) ficam em `environment`
# e sobrescrevem o que vier do .env — esses caminhos so fazem sentido dentro
# do container.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./webapp-01
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker:
    build:
      context: ./webapp-01
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker-sped:
    profiles: ["sped"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sped
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker-sped-merge:
    profiles: ["sped"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sped-merge
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker-comparacao-planilhas:
    profiles: ["comparacao"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-comparacao
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

  worker-comparacao-nfse:
    profiles: ["nfse"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-comparacao-nfse
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - job-data:/data/jobs
    depends_on:
      - redis

volumes:
  redis-data:
  job-data:

# Stack única do monorepo (webapp-01 + workers que embutem webapp-02..07).
# Da raiz webapp:  docker compose up -d --build
#
# Services CORE (sobem por padrao):  redis, api, worker (NFE), worker-sci-consolidado
# Profiles disponiveis:               sped, comparacao, nfse, gnre
# Para subir tudo:
#   docker compose --profile sped --profile comparacao --profile nfse --profile gnre up -d
#
# Mapa worker -> engine Python:
#   worker-sci-consolidado    -> webapp-04            (SCI -> Excel)
#   worker-sped               -> webapp-02/sped_engine (SPED -> XLSX)
#   worker-sped-merge         -> webapp-03            (XLSX -> SPED)
#   worker-comparacao-planilhas -> webapp-05          (Comparador Planilhas)
#   worker-comparacao-nfse    -> webapp-06            (Comparador NFS-e, Gemini OCR)
#   worker-gnre               -> webapp-07            (Extrator GNRE)
#   worker-sci-portal-nacional -> webapp-08           (Conciliador NFS-e SCI x SEFAZ, Node engine)
#
# Bind mount ./temp_jobs:/data/jobs e' compartilhado por todos: a API grava em
# /data/jobs/<id>/... (caminho do container), que aparece no host Windows em
# D:/aplicativos/webapp/temp_jobs/<id>/...
#
# Variaveis de ambiente: lidas de ./.env (env_file). Variaveis tecnicas
# fixas (REDIS_URL interno, TEMP_JOBS_ROOT no volume) ficam em `environment`
# e sobrescrevem o que vier do .env — esses caminhos so fazem sentido dentro
# do container.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./webapp-01
      dockerfile: docker/Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker:
    build:
      context: ./webapp-01
      dockerfile: docker/Dockerfile
      target: worker
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-sci-consolidado:
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sci-consolidado
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-sped:
    profiles: ["sped"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sped
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-sped-merge:
    profiles: ["sped"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sped-merge
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-comparacao-planilhas:
    profiles: ["comparacao"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-comparacao
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-sci-portal-nacional:
    profiles: ["comparacao"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-sci-portal-nacional
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
      SCI_PORTAL_DIR: /app/engines/sci-portal-nacional
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-comparacao-nfse:
    profiles: ["nfse"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-comparacao-nfse
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
    volumes:
      - ./temp_jobs:/data/jobs
    depends_on:
      - redis

  worker-gnre:
    profiles: ["gnre"]
    build:
      context: .
      dockerfile: webapp-01/docker/Dockerfile.worker-gnre
    env_file:
      - ./.env
    environment:
      REDIS_URL: redis://redis:6379
      TEMP_JOBS_ROOT: /data/jobs
      GNRE_DB_PATH: /data/gnre/gnre.db
    volumes:
      - ./temp_jobs:/data/jobs
      - gnre-data:/data/gnre
    depends_on:
      - redis

volumes:
  redis-data:
  gnre-data:
